# ==============================================================================
# GhostFaceVPN — Nginx Reverse Proxy Configuration
# Порт: 8443 (HTTPS)
# Домен: ghostfacevpn.duckdns.org (IP: 82.27.77.11)
#
# НАЗНАЧЕНИЕ:
# - Порт 443 занят VLESS Reality (Xray direct TCP inbound).
# - Порт 9443 занят локальным сайтом маскировки (selfsteal).
# - Порт 8443 используется для HTTPS-вебхуков (Telegram официально поддерживает
#   порты 443, 80, 88, 8443), платёжных систем (FreeKassa, CryptoBot),
#   Telegram Mini App (/webapp), умной подписки (/sub/mobile/) и документов.
#
# УСТАНОВКА НА VPS:
#   sudo cp /opt/ghostvpn/deploy/nginx-ghostvpn.conf /etc/nginx/sites-available/ghostvpn.conf
#   sudo ln -sf /etc/nginx/sites-available/ghostvpn.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;

    server_name ghostfacevpn.duckdns.org 82.27.77.11;

    # Пути к SSL-сертификатам Let's Encrypt для домена ghostfacevpn.duckdns.org
    ssl_certificate /etc/letsencrypt/live/ghostfacevpn.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ghostfacevpn.duckdns.org/privkey.pem;

    # Оптимизация параметров TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Максимальный размер загрузки
    client_max_body_size 16M;

    # Логи доступа и ошибок
    access_log /var/log/nginx/ghostvpn_access.log;
    error_log /var/log/nginx/ghostvpn_error.log warn;

    # Проксирование всех маршрутов сервиса в Uvicorn (FastAPI)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Заголовки проксирования
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # Поддержка WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Таймауты ожидания ответа
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
